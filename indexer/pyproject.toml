[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paypool-indexer"
version = "0.1.0"
description = "Off-chain event indexer and REST API for PayPool"
authors = [{ name = "PayPool Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "arq>=0.25.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.28",
    "web3>=6.15.0",
    "pydantic-settings>=2.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
